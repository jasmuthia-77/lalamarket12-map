<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LM12 Booth Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
<style>
/* layout: directory rail + full-bleed floor plan; on phones the plan sits above a directory sheet */
:root{--bg:#eef0f6;--panel:#fff;--ink:#171a33;--mute:#5c6080;--line:#d6d9e6;--floor:#fff;--booth:#dfe3fb;--booth-line:#8e96c9;--block:#b9bccb;--wall:#262a45;--accent:#2f3fd0;--on-accent:#fff;--route:#e0315f;--sel:#ffd23f;--on-sel:#171a33;
--font:'Archivo',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1122;--panel:#181b31;--ink:#eceefb;--mute:#a3a8c8;--line:#2e3252;--floor:#15182c;--booth:#2a3058;--booth-line:#5b659f;--block:#444861;--wall:#aab0d4;--accent:#8d9bff;--on-accent:#10122a;--route:#ff6b8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1122;--panel:#181b31;--ink:#eceefb;--mute:#a3a8c8;--line:#2e3252;--floor:#15182c;--booth:#2a3058;--booth-line:#5b659f;--block:#444861;--wall:#aab0d4;--accent:#8d9bff;--on-accent:#10122a;--route:#ff6b8f;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.35 var(--font)}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
header,#search,#detail,#list{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-top:14px;padding-bottom:8px}
h1{margin:0;font-size:22px;font-weight:800;font-stretch:80%}
header p{margin:0;color:var(--mute);font-size:13px}
#search{padding-bottom:10px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:16px}
#detail{padding-block:12px;border-bottom:1px solid var(--line);max-height:60%;overflow:auto;flex:none}
#detail h2{margin:0;font-size:20px;font-stretch:85%;line-height:1.15;overflow-wrap:anywhere}
#detail p{margin:4px 0 10px;color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 11px;font-size:13px;font-weight:600}
.btn.on,.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#list{list-style:none;margin:0;overflow:auto;flex:1;min-height:0;padding-bottom:12px}
#list button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0}
#list b{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
#list span{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
#list button[aria-current="true"] b{color:var(--accent)}
.empty{padding:14px 0;color:var(--mute)}
main{position:relative;min-width:0;min-height:0}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.floor{fill:var(--floor)}.wall{fill:var(--wall);fill-rule:evenodd}.block{fill:var(--block)}
.booth rect{fill:var(--booth);stroke:var(--booth-line);stroke-width:.6}
.booth{cursor:pointer}.booth:hover rect{stroke:var(--accent);stroke-width:1.6}
.booth text{fill:var(--ink);text-anchor:middle;font-family:var(--font);pointer-events:none}
.booth .num{font-size:11px;font-weight:700}.booth .nm{font-weight:600;font-stretch:75%;display:none}
.zoomed .booth .nm{display:block}.zoomed .booth .num{font-size:6px;font-weight:600;opacity:.7}
.booth.saved rect{stroke:var(--route);stroke-width:2}
.booth.sel rect{fill:var(--sel);stroke:var(--ink);stroke-width:1.6}.booth.sel text{fill:var(--on-sel);opacity:1}
.booth.start rect{fill:var(--accent)}.booth.start text{fill:var(--on-accent)}
.lbl{fill:var(--mute);font:600 8px var(--font);text-anchor:middle;pointer-events:none}
#flow{fill:none;stroke:var(--route);stroke-width:1.4;stroke-dasharray:5 5;opacity:.6}
#route{fill:none;stroke:var(--route);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 7;animation:walk .8s linear infinite}
@keyframes walk{to{stroke-dashoffset:-8}}
@media (prefers-reduced-motion:reduce){#route{animation:none}}
.pin circle{fill:var(--route);stroke:var(--floor);stroke-width:2}
.gate rect{fill:var(--wall)}.gate text{fill:var(--floor);font:800 10px var(--font);text-anchor:middle}
.tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tools .btn{min-width:40px;min-height:40px;box-shadow:0 1px 4px #0002}
@media (max-width:760px){
#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
aside{display:contents}
#top{grid-row:1;background:var(--panel);border-bottom:1px solid var(--line)}
header{padding-top:8px;padding-bottom:6px}header p{display:none}h1{font-size:18px}
#search{border:0}
main{grid-row:2}
#sheet{grid-row:3;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;max-height:42vh;min-height:0}
#detail{max-height:none;border:0}
.tools{flex-direction:row;bottom:8px;right:8px}.tools .btn{min-height:34px;min-width:34px;padding:5px 9px}
#list{display:none}
.browsing #list{display:block;height:40vh}
}
@media (min-width:761px){#sheet{display:contents}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
<aside>
 <div id="top">
  <header><h1>LM12 Booth Map</h1><p>City Hall, Pondok Indah Mall 3</p></header>
  <div id="search"><input id="q" type="search" placeholder="Search tenant or booth number" autocomplete="off" aria-label="Search tenant or booth number"></div>
 </div>
 <div id="sheet"><section id="detail" aria-live="polite"></section><ul id="list"></ul></div>
</aside>
<main>
 <svg id="map" role="group" aria-label="Floor plan of the event hall"></svg>
 <div class="tools">
  <button class="btn" id="flowBtn" aria-pressed="false">Visitor flow</button>
  <button class="btn" id="zin" aria-label="Zoom in">+</button>
  <button class="btn" id="zout" aria-label="Zoom out">−</button>
  <button class="btn" id="fit">Whole hall</button>
 </div>
</main>
</div>

const {x0,y0,c,nx,ny,cells}=D.grid;
const centre=i=>[x0+(i%nx)*c+c/2,y0+Math.floor(i/nx)*c+c/2];

const pointsOf=k=>GATES[k]?[GATES[k].p]:doors(B[k]);
function path(from,to){
 const src=from.map(p=>snap(...p)),goal=new Set(to.map(p=>snap(...p)));
 const g=new Float64Array(cells.length).fill(Infinity),prev=new Int32Array(cells.length).fill(-1),heap=[];
 const push=(d,i)=>{let k=heap.length;heap.push([d,i]);while(k){const p=(k-1)>>1;if(heap[p][0]<=d)break;heap[k]=heap[p];k=p}heap[k]=[d,i]};
 const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){let k=0;for(;;){let m=2*k+1;if(m>=heap.length)break;if(m+1<heap.length&&heap[m+1][0]<heap[m][0])m++;if(heap[m][0]>=last[0])break;heap[k]=heap[m];k=m}heap[k]=last}return top};
 for(const i of src){g[i]=0;push(0,i)}
 while(heap.length){
  const[d,i]=pop();if(d>g[i])continue;
  if(goal.has(i)){const out=[];for(let j=i;j>=0;j=prev[j])out.push(j);return smooth(out.reverse())}
  const x=i%nx,y=(i/nx)|0;
  for(let dx=-1;dx<2;dx++)for(let dy=-1;dy<2;dy++){
   const a=x+dx,b=y+dy;if((!dx&&!dy)||a<0||b<0||a>=nx||b>=ny)continue;
   const j=b*nx+a;if(cells[j]==='0'||(dx&&dy&&(cells[y*nx+a]==='0'||cells[b*nx+x]==='0')))continue;
   const nd=d+(dx&&dy?1.414:1)*(cells[j]==='1'?1.8:1);if(nd<g[j]){g[j]=nd;prev[j]=i;push(nd,j)}

}

}
let exitPts=null;
$('#detail').onclick=e=>{const a=e.target.closest('button');if(!a)return;const ds=a.dataset;
 if('browse'in ds){$('#app').classList.toggle('browsing');return}
 if(ds.here){start=+ds.here;sel=null;exitPts=null;render(false);return}
 if(ds.from){start=ds.from;exitPts=null;render(true);return}
 if(ds.go){sel=null;exitPts=path(pointsOf(start),pointsOf('out'));render(true);return}
 if('save'in ds){const n=sel.t.name;saved.has(n)?saved.delete(n):saved.add(n);try{localStorage.setItem('lm12saved',JSON.stringify([...saved]))}catch(x){}render(false);return}
 if('close'in ds){sel=null;exitPts=null;render(false);fit()}};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const sorted=[...T.values()].sort((a,b)=>a.name.localeCompare(b.name));
function matches(){const q=norm($('#q').value);if(!q)return[...sorted.filter(t=>saved.has(t.name)),...sorted.filter(t=>!saved.has(t.name))];
 if(/^[abcd]?\d+$/.test(q))return sorted.filter(t=>t.booths.some(b=>String(b.n)===q||b.code.toLowerCase()===q));
 return sorted.filter(t=>norm(t.name).includes(q))}
function list(){const m=matches();$('#list').innerHTML=m.map(t=>`<li><button data-t="${esc(t.name).replace(/"/g,'&quot;')}" aria-current="${sel?.t===t}"><b>${saved.has(t.name)?'★ ':''}${esc(t.listed?t.name:'Tenant not listed')}</b><span>${codes(t)}</span></button></li>`).join('')||'<li class="empty">No tenant matches. Try part of the name or a booth number.</li>'}
$('#list').onclick=e=>{const a=e.target.closest('button');if(!a)return;exitPts=null;select(T.get(a.dataset.t),null,true)};
$('#q').addEventListener('input',()=>{$('#app').classList.add('browsing');list()});
$('#q').addEventListener('focus',()=>$('#app').classList.add('browsing'));
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const m=matches();if(m[0]){exitPts=null;select(m[0],null,true)}}if(e.key==='Escape'){$('#app').classList.remove('browsing');$('#q').blur()}});
svg.addEventListener('pointerdown',()=>{$('#app').classList.remove('browsing');$('#q').blur()});
/* links: #booth-18 opens a booth, #at-18 sets "you are here" */
function fromHash(){const m=location.hash.match(/^#(booth|at)-(\d+)$/);if(!m||!B[m[2]])return false;exitPts=null;
 if(m[1]==='at'){start=+m[2];sel=null;render(false);frame(doors(B[start]))}else select(B[m[2]].tenant,+m[2]);return true}
addEventListener('hashchange',fromHash);addEventListener('resize',apply);
apply();render(false);fromHash();
</script>
